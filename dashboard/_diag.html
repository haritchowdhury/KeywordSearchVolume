<!DOCTYPE html><html><head></head><body>
<pre id="r">running</pre>
<iframe id="f" width="1200" height="800" src="index.html"></iframe>
<script>
var f = document.getElementById('f');
var errors = [];
f.addEventListener('load', function () {
  f.contentWindow.addEventListener('error', function (e) { errors.push('error: ' + String(e.message || e)); });
  f.contentWindow.addEventListener('unhandledrejection', function (e) { errors.push('rejection: ' + String(e.reason)); });
});
setTimeout(function () {
  var doc = f.contentDocument;
  var w = f.contentWindow;
  var r = {};
  r.chartLoaded = typeof w.Chart !== 'undefined';
  r.treemapLoaded = r.chartLoaded && (function(){ try { return typeof w.Chart.registry.getController('treemap') === 'function'; } catch(e){ return false; } })();
  r.scripts = [];
  doc.querySelectorAll('script').forEach(function (s) { r.scripts.push(s.src); });
  r.dataCanvases = [];
  ['chartTopKeywords','chartTreemap'].forEach(function(id){
    var c = doc.getElementById(id);
    r.dataCanvases.push(id + '=' + (c ? (w.Chart.getChart(c) ? 'hasChart' : 'noChart') : 'missing'));
  });
  r.lastUpdated = doc.getElementById('last-updated').textContent;
  r.total = doc.getElementById('c-total').textContent;
  r.tableRows = doc.querySelectorAll('#table-body tr').length;
  r.bannerShown = !doc.getElementById('error-banner').classList.contains('hidden');
  r.bannerMsg = doc.getElementById('error-msg').textContent;
  r.errors = errors;
  document.getElementById('r').textContent = JSON.stringify(r, null, 2);
}, 6000);
</script></body></html>
